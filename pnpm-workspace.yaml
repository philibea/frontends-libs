packages:
  - packages/*
catalogMode: strict
cleanupUnusedCatalogs: true

catalog:
  '@arethetypeswrong/core': 0.18.5
  '@changesets/cli': 2.31.1
  '@types/node': 22.20.3
  deepmerge-ts: 7.1.5
  nano-staged: 1.0.2
  oxfmt: 0.68.0
  oxlint: 1.75.0
  oxlint-tsgolint: 7.0.2001
  publint: 0.3.24
  tsdown: 0.23.0
  turbo: 2.10.13
  typescript: 7.0.2

pmOnFail: error
# Needed as we run a pnpm install after building packages
optimisticRepeatInstall: false

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    "@types/react": 18 || 19
    react: 18 || 19
    react-dom: 18 || 19

savePrefix: ""

supportedArchitectures:
  cpu: [ x64, arm64 ]
  os: [ darwin, current ]
